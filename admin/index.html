<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>WOD Admin</title>
<link rel="icon" href="/logo.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,400&family=Lato:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="admin.css" />
</head>
<body>
<div class="boot" id="boot"><span class="spinner"></span></div>
<div id="shell" hidden>
  <aside id="sidebar" aria-label="Main">
    <a class="brand" href="#/dashboard"><img src="/logo.jpg" alt="" /><span><b>World of Discipline</b><small>Admin dashboard</small></span></a>
    <nav id="nav"></nav>
    <div class="side-foot"><a href="/" target="_blank" rel="noopener" id="viewSite"></a></div>
  </aside>
  <div id="overlay"></div>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Open menu"></button>
      <h1 id="pageTitle">Dashboard</h1>
      <div class="me"><div class="who"><b id="meName"></b><small id="meEmail"></small></div><div class="avatar" id="meAvatar"></div></div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="modalRoot"></div>
<script src="admin.js"></script>
<script src="pages.js"></script>
</body>
</html>
