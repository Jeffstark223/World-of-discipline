# Render Blueprint for the WOD website + admin dashboard.
# IMPORTANT: a Persistent Disk requires a PAID Render web service plan (Starter or higher).
# Without the disk, everything in SQLite and every uploaded image is deleted on each deploy/restart.
services:
  - type: web
    name: wod-cms
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/wod.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: BACKUP_DIR
        value: /var/data/backups
    disk:
      name: wod-data
      mountPath: /var/data
      sizeGB: 2
